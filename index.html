<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan Masjid Baitul Jannah</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- PapaParse CDN untuk parsing data CSV dari Google Sheets -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header / Banner Header -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center sm:text-left sm:flex sm:items-center sm:justify-between">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold flex items-center justify-center sm:justify-start gap-2">
                    <i class="fa-solid fa-mosque"></i> Masjid Baitul Jannah
                </h1>
                <p class="text-emerald-100 text-xs sm:text-sm mt-1">Transparansi Laporan Keuangan Kas Masjid</p>
            </div>
            <div class="mt-3 sm:mt-0 text-xs text-emerald-200 bg-emerald-800/60 px-3 py-1.5 rounded-lg inline-block">
                <i class="fa-solid fa-sync fa-spin mr-1" id="loadingIcon"></i> Realtime Update
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Kontrol Filter Tahun & Bulan -->
        <div class="bg-white p-4 rounded-xl shadow-sm border border-slate-200 mb-6 flex flex-wrap gap-4 items-center justify-between">
            <div class="flex items-center gap-2 w-full sm:w-auto">
                <label class="text-xs sm:text-sm font-semibold text-slate-600">Pilih Periode:</label>
                <select id="selectYear" onchange="renderCurrentPeriod()" class="bg-slate-100 border border-slate-300 text-slate-700 text-sm rounded-lg p-2 font-medium focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="2026">2026</option>
                    <option value="2025">2025</option>
                    <option value="2024" selected>2024</option>
                </select>
                <select id="selectMonth" onchange="renderCurrentPeriod()" class="bg-slate-100 border border-slate-300 text-slate-700 text-sm rounded-lg p-2 font-medium focus:ring-emerald-500 focus:border-emerald-500">
                    <option value="01">Januari</option>
                    <option value="02">Februari</option>
                    <option value="03">Maret</option>
                    <option value="04">April</option>
                    <option value="05">Mei</option>
                    <option value="06">Juni</option>
                    <option value="07">Juli</option>
                    <option value="08">Agustus</option>
                    <option value="09">September</option>
                    <option value="10">Oktober</option>
                    <option value="11">November</option>
                    <option value="12">Desember</option>
                </select>
            </div>
            <button onclick="fetchSheetData()" class="text-xs text-emerald-700 hover:text-emerald-900 font-semibold flex items-center gap-1">
                <i class="fa-solid fa-rotate-right"></i> Refresh Data
            </button>
        </div>

        <!-- Kartu Ringkasan Finansial -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Saldo Awal</p>
                <p id="txtSaldoAwal" class="text-sm sm:text-base font-bold text-slate-700 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Total Pemasukan</p>
                <p id="txtTotalMasuk" class="text-sm sm:text-base font-bold text-emerald-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Total Pengeluaran</p>
                <p id="txtTotalKeluar" class="text-sm sm:text-base font-bold text-rose-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-3 sm:p-4 rounded-xl shadow-sm border border-slate-200">
                <p class="text-[11px] sm:text-xs text-slate-500 font-medium">Saldo Akhir</p>
                <p id="txtSaldoAkhir" class="text-sm sm:text-base font-bold text-emerald-800 mt-1">Rp 0</p>
            </div>
        </div>

        <!-- Tabel Pemasukan -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 overflow-hidden">
            <div class="bg-emerald-50 px-4 py-3 border-b border-emerald-100 flex justify-between items-center">
                <h2 class="font-bold text-emerald-800 text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-circle-arrow-down text-emerald-600"></i> Pemasukan Kas
                </h2>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-200">
                            <th class="pb-2 font-semibold w-24">Tanggal</th>
                            <th class="pb-2 font-semibold">Keterangan</th>
                            <th class="pb-2 font-semibold text-right">Nominal (Rp)</th>
                        </tr>
                    </thead>
                    <tbody id="tblPemasukan" class="divide-y divide-slate-100">
                        <!-- Transaksi dimasukkan via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Tabel Pengeluaran -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 mb-6 overflow-hidden">
            <div class="bg-rose-50 px-4 py-3 border-b border-rose-100 flex justify-between items-center">
                <h2 class="font-bold text-rose-800 text-sm sm:text-base flex items-center gap-2">
                    <i class="fa-solid fa-circle-arrow-up text-rose-600"></i> Pengeluaran Operasional
                </h2>
            </div>
            <div class="p-4 overflow-x-auto">
                <table class="w-full text-left text-xs sm:text-sm">
                    <thead>
                        <tr class="text-slate-500 border-b border-slate-200">
                            <th class="pb-2 font-semibold w-24">Tanggal</th>
                            <th class="pb-2 font-semibold">Keterangan</th>
                            <th class="pb-2 font-semibold text-right">Nominal (Rp)</th>
                        </tr>
                    </thead>
                    <tbody id="tblPengeluaran" class="divide-y divide-slate-100">
                        <!-- Transaksi dimasukkan via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>

    </main>

    <script>
        // MASUKKAN LINK CSV PUBLISH DARI GOOGLE SHEETS ANDA DI SINI
        const GOOGLE_SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQ.../pub?output=csv';

        let rawFinancialData = [];

        const formatRupiah = (num) => "Rp " + (Number(num) || 0).toLocaleString("id-ID");

        function fetchSheetData() {
            document.getElementById('loadingIcon').classList.add('fa-spin');
            
            Papa.parse(GOOGLE_SHEET_CSV_URL, {
                download: true,
                header: true,
                skipEmptyLines: true,
                complete: function(results) {
                    rawFinancialData = results.data;
                    document.getElementById('loadingIcon').classList.remove('fa-spin');
                    renderCurrentPeriod();
                },
                error: function(err) {
                    console.error("Gagal membaca Google Sheets:", err);
                    document.getElementById('loadingIcon').classList.remove('fa-spin');
                }
            });
        }

        function renderCurrentPeriod() {
            const yr = document.getElementById('selectYear').value;
            const mo = document.getElementById('selectMonth').value;
            const periodKey = `${yr}-${mo}`; // format YYYY-MM

            let saldoAwal = 0;
            let listPemasukan = [];
            let listPengeluaran = [];

            rawFinancialData.forEach(row => {
                if(!row.Tanggal) return;
                
                // Asumsi format tanggal di Sheets: YYYY-MM-DD atau DD/MM/YYYY
                let dateParts = row.Tanggal.split('/');
                let rowPeriod = "";
                
                if(dateParts.length === 3) {
                    // Format DD/MM/YYYY
                    rowPeriod = `${dateParts[2]}-${dateParts[1].padStart(2, '0')}`;
                } else if(row.Tanggal.includes('-')) {
                    // Format YYYY-MM-DD
                    rowPeriod = row.Tanggal.substring(0, 7);
                }

                if (rowPeriod === periodKey) {
                    const jenis = (row.Jenis || '').trim();
                    const nominal = parseFloat((row.Nominal || '0').replace(/[^0-9.-]+/g, "")) || 0;

                    if (jenis === 'Saldo Awal') {
                        saldoAwal = nominal;
                    } else if (jenis === 'Pemasukan') {
                        listPemasukan.push({ tgl: row.Tanggal, ket: row.Keterangan, jumlah: nominal });
                    } else if (jenis === 'Pengeluaran') {
                        listPengeluaran.push({ tgl: row.Tanggal, ket: row.Keterangan, jumlah: nominal });
                    }
                }
            });

            let totalMasuk = listPemasukan.reduce((sum, item) => sum + item.jumlah, 0);
            let totalKeluar = listPengeluaran.reduce((sum, item) => sum + item.jumlah, 0);
            let saldoAkhir = saldoAwal + totalMasuk - totalKeluar;

            // Render Kartu Ringkasan
            document.getElementById('txtSaldoAwal').innerText = formatRupiah(saldoAwal);
            document.getElementById('txtTotalMasuk').innerText = formatRupiah(totalMasuk);
            document.getElementById('txtTotalKeluar').innerText = formatRupiah(totalKeluar);
            document.getElementById('txtSaldoAkhir').innerText = formatRupiah(saldoAkhir);

            // Render Tabel Pemasukan
            document.getElementById('tblPemasukan').innerHTML = listPemasukan.length ? listPemasukan.map(item => `
                <tr>
                    <td class="py-2.5 text-slate-400 font-mono text-xs">${item.tgl}</td>
                    <td class="py-2.5 text-slate-700">${item.ket}</td>
                    <td class="py-2.5 text-right font-semibold text-emerald-600">${formatRupiah(item.jumlah)}</td>
                </tr>
            `).join('') : `<tr><td colspan="3" class="py-4 text-center text-slate-400 italic">Tidak ada data pemasukan</td></tr>`;

            // Render Tabel Pengeluaran
            document.getElementById('tblPengeluaran').innerHTML = listPengeluaran.length ? listPengeluaran.map(item => `
                <tr>
                    <td class="py-2.5 text-slate-400 font-mono text-xs">${item.tgl}</td>
                    <td class="py-2.5 text-slate-700">${item.ket}</td>
                    <td class="py-2.5 text-right font-semibold text-rose-600">${formatRupiah(item.jumlah)}</td>
                </tr>
            `).join('') : `<tr><td colspan="3" class="py-4 text-center text-slate-400 italic">Tidak ada data pengeluaran</td></tr>`;
        }

        // Muat data dari Google Sheets saat pertama kali dipanggil
        document.addEventListener('DOMContentLoaded', fetchSheetData);
    </script>
</body>
</html>
