<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Laporan Keuangan Masjid Baitul Jannah</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">

    <!-- Header Publik -->
    <header class="bg-emerald-700 text-white shadow-md">
        <div class="max-w-4xl mx-auto px-4 py-6 text-center sm:text-left sm:flex sm:items-center sm:justify-between">
            <div>
                <h1 class="text-xl sm:text-2xl font-bold flex items-center justify-center sm:justify-start gap-2">
                    <i class="fa-solid fa-mosque"></i> Masjid Baitul Jannah
                </h1>
                <p class="text-emerald-100 text-xs sm:text-sm mt-1">Transparansi Laporan Keuangan Kas Masjid</p>
            </div>
            <span class="mt-3 sm:mt-0 text-xs bg-emerald-800 text-emerald-100 px-3 py-1.5 rounded-full inline-block">
                <i class="fa-solid fa-shield-halved mr-1"></i> Laporan Resmi Jamaah
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 mt-6">

        <!-- Kartu Ringkasan -->
        <div class="grid grid-cols-2 sm:grid-cols-4 gap-3 mb-6">
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-[11px] text-slate-500 font-medium">Saldo Awal</p>
                <p id="txtSaldoAwal" class="text-sm sm:text-base font-bold text-slate-700 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-[11px] text-slate-500 font-medium">Total Pemasukan</p>
                <p id="txtPemasukan" class="text-sm sm:text-base font-bold text-emerald-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-white p-3.5 rounded-xl border border-slate-200 shadow-sm">
                <p class="text-[11px] text-slate-500 font-medium">Total Pengeluaran</p>
                <p id="txtPengeluaran" class="text-sm sm:text-base font-bold text-rose-600 mt-1">Rp 0</p>
            </div>
            <div class="bg-purple-50 p-3.5 rounded-xl border border-purple-200 shadow-sm">
                <p class="text-[11px] text-purple-700 font-bold">Total Saldo Akhir</p>
                <p id="txtSaldoAkhir" class="text-base sm:text-lg font-extrabold text-purple-900 mt-1">Rp 0</p>
            </div>
        </div>

        <!-- Rincian Akad / Dana -->
        <div class="bg-white rounded-xl shadow-sm border border-slate-200 p-4 mb-6">
            <p class="text-xs font-bold text-slate-600 mb-3 flex items-center gap-1.5">
                <i class="fa-solid fa-wallet text-purple-600"></i> Rincian Saldo per Akad / Dana
            </p>
            <div id="containerAkad" class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                <!-- Data Rincian Otomatis -->
            </div>
        </div>

        <!-- Tabel Pemasukan & Pengeluaran (Read Only) -->
        <div class="space-y-6">
            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="bg-emerald-50 px-4 py-3 font-bold text-emerald-800 text-sm">Pemasukan Kas</div>
                <div class="p-4 overflow-x-auto">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <tbody id="tblPemasukan" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <div class="bg-white rounded-xl border border-slate-200 overflow-hidden shadow-sm">
                <div class="bg-rose-50 px-4 py-3 font-bold text-rose-800 text-sm">Pengeluaran Kas</div>
                <div class="p-4 overflow-x-auto">
                    <table class="w-full text-left text-xs sm:text-sm">
                        <tbody id="tblPengeluaran" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

    </main>
</body>
</html>
